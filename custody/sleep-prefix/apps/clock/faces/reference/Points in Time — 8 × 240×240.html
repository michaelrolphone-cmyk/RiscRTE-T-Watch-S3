<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule Watch Faces — 8 × 240×240</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--cap:#7d8c90;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:#000}
body{min-height:100vh;padding:28px 16px;font-family:'Rajdhani','Segoe UI',sans-serif}
h1{margin:0 0 24px;text-align:center;font:500 14px 'Orbitron','Segoe UI',sans-serif;letter-spacing:.3em;color:var(--cap)}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:30px 16px;justify-items:center;max-width:1200px;margin:0 auto}
figure{margin:0;text-align:center}
.case{padding:12px;border-radius:34px;background:linear-gradient(145deg,#2a2d30,#0a0b0c);box-shadow:0 0 0 2px #1b1d1f,0 14px 30px #000}
svg.w{display:block;width:240px;height:240px;border-radius:22px;background:#000;overflow:hidden}
figcaption{margin-top:12px;font-size:13px;letter-spacing:.3em;color:var(--cap)}
.f{fill:none}
.o{font-family:'Orbitron','Rajdhani','Segoe UI',sans-serif}
.r{font-family:'Rajdhani','Segoe UI',sans-serif}
.m{font-family:'Share Tech Mono','Courier New',monospace}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="dd"><filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>
<h1>UP NEXT · 240 × 240</h1>
<div id="grid"></div>
<script>
const R=Math.PI/180,p2=n=>('0'+n).slice(-2),G='filter="url(#g)"';
const P=(r,a,x=120,y=120)=>[(x+r*Math.sin(a*R)).toFixed(1),(y-r*Math.cos(a*R)).toFixed(1)];
const A=(r,a,b,x=120,y=120)=>{b=Math.min(b,a+359.9);return `M${P(r,a,x,y)} A${r} ${r} 0 ${b-a>180?1:0} 1 ${P(r,b,x,y)}`};
const L=(a,r1,r2,c,w,x=120,y=120)=>{const u=P(r1,a,x,y),v=P(r2,a,x,y);return `<line x1="${u[0]}" y1="${u[1]}" x2="${v[0]}" y2="${v[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};
const X=(x,y,s,z,c,k='o',e='')=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${z}" fill="${c}" class="${k}" ${e}>${s}</text>`;
const C=(x,y,r,c,e='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${e}/>`;
const RC=(r,c,w,x=120,y=120)=>`<circle cx="${x}" cy="${y}" r="${r}" class="f" stroke="${c}" stroke-width="${w}"/>`;
const S=(d,c,w,e='')=>`<path d="${d}" class="f" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${e}/>`;
const FIT='textLength="{w}" lengthAdjust="spacingAndGlyphs"';
const fit=w=>FIT.replace('{w}',w);
const batt=(y,w=7,g=2,lbl='BATT 84%',lc='#7d8c90')=>{const x0=120-(10*w+9*g)/2;let o=X(120,y-6,lbl,9,lc,'r','letter-spacing="2"');for(let i=0;i<10;i++)o+=`<rect x="${x0+i*(w+g)}" y="${y}" width="${w}" height="5" rx="1" fill="${i<8?'#3dff9a':'#0a2014'}"/>`;return o};
const bar=(x,y,w,c,bg)=>`<rect x="${x}" y="${y}" width="${w}" height="3" rx="1.5" fill="${bg}"/><rect x="${x}" y="${y}" width="${(w*.84).toFixed(1)}" height="3" rx="1.5" fill="${c}"/>`;

// extra defs: edge-fade masks, glow gradients, sun and wave gradients
document.getElementById('dd').insertAdjacentHTML('beforeend',
 [['ra','#19e3ff'],['rb','#ff3dcb'],['rc','#6d5bff'],['rm','#9fb4ff'],['rs','#ffb020']].map(([i,c])=>`<radialGradient id="${i}"><stop offset="0" stop-color="${c}" stop-opacity=".6"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`).join('')
 +'<linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3d6e"/><stop offset="1" stop-color="#ffb020"/></linearGradient><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="2.4" width="4" height="1.6" fill="#000"/></pattern>'
 +'<linearGradient id="sn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd24a"/><stop offset="1" stop-color="#ff2d8a"/></linearGradient>'
 +'<linearGradient id="gw" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="0"><stop offset="0" stop-color="#3d7bff" stop-opacity="0"/><stop offset=".25" stop-color="#3d7bff"/><stop offset=".55" stop-color="#b24dff"/><stop offset=".8" stop-color="#ff4d9a"/><stop offset="1" stop-color="#ff4d9a" stop-opacity="0"/></linearGradient>'
 +['x','y'].map(d=>`<linearGradient id="g${d}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${d=='x'?240:0}" y2="${d=='y'?240:0}"><stop offset="0" stop-color="#000"/><stop offset=".2" stop-color="#fff"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient><mask id="m${d}" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240"><rect width="240" height="240" fill="url(#g${d})"/></mask>`).join(''));
const EF=s=>`<g mask="url(#mx)"><g mask="url(#my)">${s}</g></g>`;
const BT=(cx,y,w=6,g=2,c='#3dff9a',k=8)=>{const x0=cx-(10*w+9*g)/2;let o='';for(let i=0;i<10;i++)o+=`<rect x="${x0+i*(w+g)}" y="${y}" width="${w}" height="4" rx="1" fill="${c}" fill-opacity="${i<k?1:.16}"/>`;return o};
const blob=(id,x,y,r)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="url(#${id})"/>`;
const STARS=Array.from({length:46},(_,i)=>{const a=Math.sin(i*127.1)*43758.5453,b=Math.sin(i*311.7)*12543.321;return[(a-Math.floor(a))*240,(b-Math.floor(b))*240,(i%3)+1.4]});
const DG=[[14,17,19,21,25,17,14],[4,12,4,4,4,4,14],[14,17,1,2,4,8,31],[31,2,4,2,1,17,14],[2,6,10,18,31,2,2],[31,16,30,1,1,17,14],[6,8,16,30,17,17,14],[31,1,2,4,8,8,8],[14,17,17,14,17,17,14],[14,17,17,15,1,2,12]];
const PH=['NEW MOON','WAXING CRESCENT','FIRST QUARTER','WAXING GIBBOUS','FULL MOON','WANING GIBBOUS','LAST QUARTER','WANING CRESCENT'];

const hs=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s)};
const VN=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),u=x-i,v=y-j,a=u*u*(3-2*u),b=v*v*(3-2*v);return hs(i,j)*(1-a)*(1-b)+hs(i+1,j)*a*(1-b)+hs(i,j+1)*(1-a)*b+hs(i+1,j+1)*a*b};
const HT=(x,y)=>(VN(x*.016,y*.016)+.5*VN(x*.034+7.3,y*.034)+.25*VN(x*.07,y*.07+3.1))/1.75;
const SGT={1:'LB',2:'BR',3:'LR',4:'TR',5:'TRLB',6:'TB',7:'TL',8:'TL',9:'TB',10:'TLBR',11:'TR',12:'LR',13:'BR',14:'LB'};
const ctr=(H,L)=>{let d='';const q=v=>Math.round(v*10)/10;
 for(let j=0;j<30;j++)for(let i=0;i<30;i++){
  const a=H[j*31+i],b=H[j*31+i+1],c=H[j*31+32+i],e=H[j*31+31+i],ix=(a>L?8:0)+(b>L?4:0)+(c>L?2:0)+(e>L?1:0);
  if(!ix||ix==15)continue;
  const x=i*8,y=j*8,p={T:[x+8*(L-a)/(b-a),y],R:[x+8,y+8*(L-b)/(c-b)],B:[x+8*(L-e)/(c-e),y+8],L:[x,y+8*(L-a)/(e-a)]},sg=SGT[ix];
  for(let m=0;m<sg.length;m+=2){const u=p[sg[m]],w=p[sg[m+1]];d+=`M${q(u[0])} ${q(u[1])}L${q(w[0])} ${q(w[1])}`}}
 return d};

const DN=['SUN','MON','TUE','WED','THU','FRI','SAT'],DF=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const MN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const dim=(y,m)=>new Date(y,m+1,0).getDate(),yd=y=>(y%4==0&&(y%100!=0||y%400==0))?366:365;
const doy=d=>Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
const wk=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)};
const EV=[[9.5,10.25,'STANDUP','#3d9bff'],[12,13,'LUNCH','#3dff9a'],[15,16.5,'REVIEW','#ff9e1f'],[18.5,19.5,'GYM','#ff3d71']];
const SO='letter-spacing="3" stroke="#000" stroke-width="4" paint-order="stroke"';

// placeholder daily schedule: [hour, minute, event, color, phase that starts here]
const SCH=[[8,30,'WORK START','#3d9bff','WORKING'],[10,15,'BREAK','#3dff9a','ON BREAK'],[10,30,'BACK','#3d9bff','WORKING'],[12,0,'LUNCH','#ffb020','AT LUNCH'],[13,0,'BACK','#3d9bff','WORKING'],[15,0,'BREAK','#3dff9a','ON BREAK'],[15,15,'BACK','#3d9bff','WORKING'],[17,0,'WORK END','#ff3d71','OFF WORK'],[18,30,'GYM','#b24dff','AT GYM'],[22,30,'BED','#6d7bff','WIND DOWN']];
const evs=t=>{const d=t.d,ns=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),L2=[];
 [-86400,0,86400].forEach(o=>SCH.forEach(e=>L2.push({s:e[0]*3600+e[1]*60+o,n:e[2],c:e[3],ph:e[4]})));
 L2.sort((a,b)=>a.s-b.s);const k=L2.findIndex(e=>e.s>ns),nx=L2[k],pv=L2[k-1];
 return{ns,nx,pv,rem:nx.s-ns,fr:(ns-pv.s)/(nx.s-pv.s),up:L2.slice(k,k+4)}};
const hms=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s/60)%60,c=s%60;return h?`${h}:${p2(m)}:${p2(c)}`:`${p2(m)}:${p2(c)}`};
const clk=s=>{s=((s%86400)+86400)%86400;return p2(Math.floor(s/3600))+':'+p2(Math.floor(s/60)%60)};
const rel=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)}H ${p2(m%60)}M`:`${m} MIN`};

const F=[
['NEXT',t=>{const e=evs(t),h=hms(e.rem),lg=h.length>5;
 return X(120,40,t.h+':'+t.m,14,'#6b8288','o','letter-spacing="3"')+X(120,76,e.nx.n,14,e.nx.c,'r','font-weight="600" letter-spacing="5"')
 +X(120,134,h,lg?40:54,'#fff','o','font-weight="700" '+fit(lg?186:136))
 +`<rect x="30" y="150" width="180" height="4" rx="2" fill="#1a2024"/><rect x="30" y="150" width="${(180*e.fr).toFixed(1)}" height="4" rx="2" fill="${e.nx.c}"/>`
 +X(46,172,clk(e.pv.s),9,'#6b8288','o')+X(194,172,clk(e.nx.s),9,e.nx.c,'o')+BT(120,200,7,2,e.nx.c)}],

['RING',t=>{const e=evs(t),h=hms(e.rem),lg=h.length>5;
 return S(A(98,0,360),'#14191c',8)+S(A(98,0,Math.max(1,360*(1-e.fr))),e.nx.c,8,'filter="url(#g)"')
 +X(120,78,e.nx.n,12,e.nx.c,'r','font-weight="600" letter-spacing="5"')+X(120,126,h,lg?32:42,'#fff','o','font-weight="700" '+fit(lg?136:104))
 +X(120,146,'AT '+clk(e.nx.s),10,'#9aa5a8','r','letter-spacing="3"')+X(120,166,t.h+':'+t.m,12,'#6b8288','o')+BT(120,178,7,2,e.nx.c)}],

['LADDER',t=>{const e=evs(t);let g='';
 e.up.slice(0,3).forEach((u,i)=>{const y=84+i*40,hi=!i;
  g+=(hi?`<rect x="22" y="${y-18}" width="196" height="36" rx="10" fill="${u.c}" fill-opacity=".18"/>`:'')+`<rect x="22" y="${y-18}" width="3" height="36" fill="${u.c}"/>`
  +`<text x="36" y="${y+5}" font-size="${hi?15:13}" fill="${hi?'#fff':'#9aa5a8'}" class="r" font-weight="600" letter-spacing="2">${u.n}</text>`
  +`<text x="212" y="${y-1}" text-anchor="end" font-size="14" fill="${u.c}" class="o" font-weight="700">${clk(u.s)}</text><text x="212" y="${y+13}" text-anchor="end" font-size="9" fill="#6b8288" class="r" letter-spacing="2">IN ${rel(u.s-e.ns)}</text>`});
 return X(120,44,t.h+':'+t.m,18,'#fff','o','font-weight="700" letter-spacing="2"')+g+BT(120,204,7,2)}],

['DAYLINE',t=>{const e=evs(t),sx=s=>22+196*Math.min(1,Math.max(0,(s-21600)/64800));
 let o=X(120,58,t.h+':'+t.m,42,'#fff','o','font-weight="700" '+fit(124))+'<rect x="22" y="129" width="196" height="3" rx="1.5" fill="#1a2024"/>'+`<rect x="22" y="129" width="${(sx(e.ns)-22).toFixed(1)}" height="3" rx="1.5" fill="#cfe9ee"/>`;
 let c=0;SCH.forEach(v=>{if(v[2].startsWith('BACK'))return;const x=sx(v[0]*3600+v[1]*60).toFixed(1),up=c++%2==0;
  o+=`<line x1="${x}" y1="${up?112:134}" x2="${x}" y2="${up?129:151}" stroke="${v[3]}" stroke-width="2"/>`+X(x,up?106:163,v[2].replace('WORK ',''),8,v[3],'r','font-weight="600"')});
 o+=C(sx(e.ns).toFixed(1),130.5,5,'#fff','filter="url(#g)"');
 return o+X(120,188,e.nx.n+' IN '+hms(e.rem),11,e.nx.c,'r','letter-spacing="3"')+BT(120,204,7,2,e.nx.c)}],

['TRIPLE',t=>{const e=evs(t);let o=X(120,54,t.h+':'+t.m,34,'#fff','o','font-weight="700" '+fit(104));
 e.up.slice(0,3).forEach((u,i)=>{const cx=52+i*68,cy=122,r=u.s-e.ns;
  o+=RC(26,'#14191c',5,cx,cy)+S(A(26,0,Math.max(1,360*Math.min(1,r/14400)),cx,cy),u.c,5)+X(cx,cy+4,clk(r),11,'#fff','o','font-weight="700"')+X(cx,cy+46,u.n,8,u.c,'r','font-weight="600" letter-spacing="1.5"')});
 return o+BT(120,200,7,2)}],

['STATUS',t=>{const e=evs(t),ph=e.pv.ph,h=hms(e.rem),lg=h.length>5;
 return X(120,44,t.h+':'+t.m,14,'#6b8288','o','letter-spacing="3"')+X(120,98,ph,34,e.pv.c,'o','font-weight="700" '+fit(Math.min(196,ph.length*21)))
 +`<rect x="50" y="112" width="140" height="3" rx="1.5" fill="#1a2024"/><rect x="50" y="112" width="${(140*e.fr).toFixed(1)}" height="3" rx="1.5" fill="${e.pv.c}"/>`
 +X(120,140,e.nx.n+' IN',11,'#9aa5a8','r','letter-spacing="4"')+X(120,176,h,lg?30:38,'#fff','o','font-weight="700" '+fit(lg?150:116))+BT(120,200,7,2,e.pv.c)}],

['BOARD',t=>{const e=evs(t),TX=(x,y,s,c,a)=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="13" fill="${c}" class="m">${s}</text>`;
 let o='<rect x="20" y="30" width="200" height="22" fill="#241b05"/>'+TX(28,46,'NOW','#ffb020','start')+TX(212,46,`${t.h}:${t.m}:${t.s}`,'#ffb020','end');
 e.up.slice(0,4).forEach((u,i)=>{const y=58+i*26,c=i?'#c98a14':'#fff';
  o+=`<rect x="20" y="${y}" width="200" height="24" fill="${i%2?'#0d0a03':'#130f04'}"/>`+TX(28,y+17,clk(u.s),c,'start')+TX(78,y+17,u.n,c,'start')+TX(212,y+17,clk(u.s-e.ns),c,'end')});
 return o+BT(120,196,7,2,'#ffb020')}],

['WORKDAY',t=>{const e=evs(t),ns=e.ns,pf=Math.min(1,Math.max(0,(ns-30600)/30600)),BR=[[36900,37800],[43200,46800],[54000,54900]],W=196;
 let o=X(120,62,t.h+':'+t.m,30,'#fff','o','font-weight="700" '+fit(94))+X(120,84,'WORKDAY',9,'#6b8288','r','letter-spacing="4"')
 +'<rect x="22" y="92" width="196" height="44" rx="12" fill="#14191c"/>'+`<rect x="22" y="92" width="${(W*pf).toFixed(1)}" height="44" rx="12" fill="${pf<.85?'#3dff9a':'#ffb020'}"/>`;
 BR.forEach(([a,b])=>{const x1=22+W*Math.max(0,(a-30600)/30600),x2=22+W*Math.min(1,(b-30600)/30600);o+=`<rect x="${x1.toFixed(1)}" y="92" width="${(x2-x1).toFixed(1)}" height="44" fill="#000" fill-opacity=".72"/>`});
 const msg=ns<30600?'WORK STARTS IN '+hms(30600-ns):ns<61200?'WORK END IN '+hms(61200-ns):'WORKDAY COMPLETE';
 return o+X(120,121,Math.floor(pf*100)+'%',20,'#fff','o','font-weight="700" stroke="#000" stroke-width="4" paint-order="stroke"')+X(120,160,msg,11,'#cfe9ee','r','letter-spacing="3"')+BT(120,190,7,2)}]
];

const now=()=>{const d=new Date(),ms=d.getMilliseconds(),sf=d.getSeconds()+ms/1e3,mf=d.getMinutes()+sf/60,hf=d.getHours()%12+mf/60,
 w=d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase(),mo=d.toLocaleDateString('en-US',{month:'short'}).toUpperCase();
 return{d,sf,mf,hf,h:p2(d.getHours()),m:p2(d.getMinutes()),s:p2(d.getSeconds()),dt:`${w} ${p2(d.getDate())} ${mo}`,day:d.getDate(),blink:ms<500}};

const grid=document.getElementById('grid');
F.forEach(([n])=>grid.insertAdjacentHTML('beforeend',`<figure><div class="case"><svg class="w" viewBox="0 0 240 240" role="img" aria-label="${n} watch face"></svg></div><figcaption>${n}</figcaption></figure>`));
const sv=[...grid.querySelectorAll('svg.w')];
let last=0;
(function loop(ts){if(ts-last>50){last=ts;const t=now();sv.forEach((s,i)=>{s.innerHTML=F[i][1](t)})}requestAnimationFrame(loop)})(0);
</script>
</body>
</html>
