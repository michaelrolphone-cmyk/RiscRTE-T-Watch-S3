[platformio]
extra_configs = platformio.ini

; Device assembly profile. The common Runtime source has no new watch-app fork.
; Preserve the delivered T-Watch crown-recovery binding and diagnostics while
; allowing the three independent generic power service providers to be added.
[env:twatch-universal]
extends = env:esp32s3-16mb-appdata-universal
build_flags =
  ${env:esp32s3-16mb-appdata-universal.build_flags}
  -DRISC_NATIVE_RECOVERY_AXP2101=1
  -DRISC_RECOVERY_I2C_PORT=0
  -DRISC_RECOVERY_SDA=10
  -DRISC_RECOVERY_SCL=11
  -DRISC_PERFORMANCE_TRACE=1
