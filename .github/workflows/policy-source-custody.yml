name: Policy source custody
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-source-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact policy source history
        run: python scripts/check_policy_source_snapshot.py
      - name: Verify recovered source and completed preservation receipts
        run: python scripts/check_recovery_source_snapshot.py
      - name: Compile package and mutation-test syntax
        run: python -m py_compile scripts/package_demand_retained.py scripts/test_demand_policy_package.py
