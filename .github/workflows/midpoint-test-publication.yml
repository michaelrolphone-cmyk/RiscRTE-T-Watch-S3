name: Manually publish accepted midpoint 1.0.6
on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only preflight or explicitly publish only midpoint 1.0.6
        type: choice
        options: [preflight, publish]
        default: preflight
        required: true
      expected_index_commit:
        description: Exact reviewed live 1.0.3 native-bridge index commit
        type: string
        required: true
      operator_confirmation:
        description: Exact separately operator-confirmed midpoint bridge-health statement
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: twatch-driver-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -r scripts/requirements.txt
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 2d16d9dfa7abc50ce916eebc11d81423adef0000
          path: .dependencies/installed-system
          persist-credentials: false
      - name: Publication boundary regression tests
        run: python -m unittest discover -s tests -p test_midpoint_publication.py -v
      - name: Recheck frozen inputs, explicit derivation, real catalog and operator gate
        env:
          GH_TOKEN: ${{ github.token }}
          MIDPOINT_ACTION: ${{ inputs.action }}
          MIDPOINT_PREDECESSOR: ${{ inputs.expected_index_commit }}
          MIDPOINT_CONFIRMATION: ${{ inputs.operator_confirmation }}
        run: |
          python scripts/publish_midpoint_test.py "$MIDPOINT_ACTION" \
            --expected-index-commit "$MIDPOINT_PREDECESSOR" \
            --operator-confirmation "$MIDPOINT_CONFIRMATION" \
            --installed-system .dependencies/installed-system
