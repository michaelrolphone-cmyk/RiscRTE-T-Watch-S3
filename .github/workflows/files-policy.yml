name: Files lifecycle overlay recipe
on:
  push:
    branches: [work/files-input-policy-20261012]
  pull_request:
    paths: ['**/*files*policy*', '**/files-input-policy/**', '.github/workflows/files-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install pyelftools==0.32
      - run: python3 tests/test_files_policy_recipe.py
      - run: python3 -m py_compile scripts/build_files_policy.py scripts/assemble_watch_files_policy.py scripts/inspect_files_target_stack.py scripts/test_files_policy_flagoff.py scripts/prepare_x4_files_policy_overlay.py
