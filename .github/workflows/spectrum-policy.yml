name: Audio Spectrum modal policy recipe
on:
  push:
    branches: [work/spectrum-input-policy-20261012]
  pull_request:
    paths: ['**/*spectrum*policy*', '**/spectrum-input-policy/**', '.github/workflows/spectrum-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install pyelftools==0.32
      - run: python3 tests/test_spectrum_policy_recipe.py
      - run: python3 -m py_compile scripts/build_spectrum_policy.py scripts/assemble_watch_spectrum_policy.py scripts/inspect_spectrum_target_stack.py scripts/test_spectrum_policy_flagoff.py
