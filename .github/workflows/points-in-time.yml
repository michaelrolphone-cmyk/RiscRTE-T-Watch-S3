name: Validate Points in Time and schedule faces

on:
  pull_request:
    paths:
      - 'apps/clock/**'
      - 'apps/points-sources.json'
      - 'scripts/build_launcher_apps.py'
      - 'scripts/build_points_apps.py'
      - 'scripts/test_points_*.py'
      - 'tests/points_*'
      - 'tests/watch_face_categories_test.c'
      - 'tests/watch_faces_points_test.c'
      - '.github/workflows/points-in-time.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  points:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: pins
        name: Read exact shared-source pins
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('apps/points-sources.json'))
          for key in ('system-apps','utilities','runtime','productivity'):
              print(key.replace('-','_')+'='+p[key]['commit'])
          PY

      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pins.outputs.system_apps }}
          path: .deps/system-apps
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.pins.outputs.utilities }}
          path: .deps/utilities
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ${{ steps.pins.outputs.runtime }}
          path: .deps/runtime
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Productivity
          ref: ${{ steps.pins.outputs.productivity }}
          path: .deps/productivity
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python render dependency
        run: python -m pip install pillow

      - name: Nine-face production RGB565 renderer
        run: python scripts/test_points_watch_faces.py

      - name: Stable picker/category IDs
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -I. -Isdk/app tests/watch_face_categories_test.c -o /tmp/watch-face-categories
          /tmp/watch-face-categories

      - name: Recurrence projection and Clock lifecycle
        run: python scripts/test_points_integration.py --system-apps .deps/system-apps --utilities .deps/utilities

      - name: NOVA renderer regression suite
        run: python apps/clock/nova/tests/run.py

      - name: Points app host and sanitizer fixtures on Watch pins
        run: python .deps/productivity/scripts/test_points_in_time.py --system-apps .deps/system-apps --utilities .deps/utilities

      - name: Pinned ESP32-S3 compiler
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 180 \
            https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32s3-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/toolchain.tar.gz"
          echo "8aa17a6adf01efa5b1628c8ac578063a44d26ae9581d39486b92223a41ef262f  $RUNNER_TEMP/toolchain.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/toolchain"
          tar -xzf "$RUNNER_TEMP/toolchain.tar.gz" -C "$RUNNER_TEMP/toolchain"
          echo "TWATCH_CC=$RUNNER_TEMP/toolchain/xtensa-esp32s3-elf/bin/xtensa-esp32s3-elf-gcc" >> "$GITHUB_ENV"

      - name: Exact integrated Points launcher target build
        run: |
          python scripts/build_points_apps.py \
            --system-apps .deps/system-apps \
            --utilities .deps/utilities \
            --runtime .deps/runtime \
            --productivity .deps/productivity

      - uses: actions/upload-artifact@v4
        with:
          name: points-nova7-validation
          path: |
            dist/points-native/
            dist/points-launcher/
          if-no-files-found: error
          retention-days: 14
