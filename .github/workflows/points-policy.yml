name: Points lifecycle overlay recipe
on:
  push:
    branches: [work/points-input-policy-20261012]
  pull_request:
    paths: ['**/*points*policy*', '**/points-input-policy/**', '.github/workflows/points-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install pyelftools==0.32
      - run: python3 tests/test_points_policy_recipe.py
      - run: python3 tests/test_points_metadata_pack.py
      - run: python3 -m py_compile scripts/build_points_policy.py scripts/assemble_watch_points_policy.py scripts/inspect_points_target_stack.py scripts/test_points_policy_flagoff.py scripts/pack_points_elf_metadata.py
