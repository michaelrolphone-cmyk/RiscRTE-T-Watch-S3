name: Audio LoRa modal policy recipe
on:
  push:
    branches: [work/lora-input-policy-20261012]
  pull_request:
    paths: ['**/*lora*policy*', '**/lora-input-policy/**', '.github/workflows/lora-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install pyelftools==0.32
      - run: python3 tests/test_lora_policy_recipe.py
      - run: python3 -m py_compile scripts/build_lora_policy.py scripts/assemble_watch_lora_policy.py scripts/inspect_lora_target_stack.py scripts/test_lora_policy_flagoff.py
