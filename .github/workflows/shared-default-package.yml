name: Shared default package contract
on:
  push:
    branches: [work/shared-default-package]
    paths:
      - .github/workflows/shared-default-package.yml
      - scripts/package_shared_default.py
      - scripts/test_shared_default_package.py
      - docs/shared-default/**
      - profiles/native-idf61.cmake
  pull_request:
    paths:
      - .github/workflows/shared-default-package.yml
      - scripts/package_shared_default.py
      - scripts/test_shared_default_package.py
      - docs/shared-default/**
      - profiles/native-idf61.cmake
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Check default scope, frozen historical contracts and negative mutations
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/test_shared_default_package.py
