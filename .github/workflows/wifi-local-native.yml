name: Watch local Wi-Fi native qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/wifi-local-native.yml
      - docs/wifi-local-native/**
      - profiles/wifi-local-native-qualification.*
      - scripts/build_wifi_local_native.py
      - scripts/test_wifi_local_native.py
      - scripts/wifi_local_native_contract.py
      - tests/wifi_local_native/**
permissions:
  contents: read
concurrency:
  group: watch-wifi-local-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, local]
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      CCACHE_DISABLE: '1'
      IDF_CCACHE_ENABLE: '0'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VARIANT: ${{ matrix.variant }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Materialize exact source without a shared worktree or cache
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libssl-dev
          export NATIVE_ROOT="$RUNNER_TEMP/watch-wifi-local-$VARIANT"
          echo "NATIVE_ROOT=$NATIVE_ROOT" >> "$GITHUB_ENV"
          test ! -e "$NATIVE_ROOT"
          mkdir -p "$NATIVE_ROOT"/{sources,logs,metadata}
          product="$NATIVE_ROOT/sources/product"
          git init --quiet "$product"
          git -C "$product" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$product" fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C "$product" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$product" rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - "$product" "$NATIVE_ROOT" <<'PY'
          import json, os, sys
          from pathlib import Path
          product, root = map(Path, sys.argv[1:])
          p = json.loads((product/'docs/wifi-local-native/source-pins.json').read_bytes())
          assert os.environ['GITHUB_REPOSITORY'] == 'michaelrolphone-cmyk/RiscRTE-T-Watch-S3'
          assert p['publication_enabled'] is False and p['product_activation_enabled'] is False
          (root/'metadata/pins.env').write_text('BASE_SHA='+p['product_base_revision']+'\nRUNTIME_SHA='+p['runtime_revision']+'\nSDK_SHA='+p['sdk_revision']+'\n')
          (root/'metadata/ci.json').write_text(json.dumps({k: os.environ.get(k) for k in
              ('GITHUB_REPOSITORY','SOURCE_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_EVENT_NAME','VARIANT')}, indent=2)+'\n')
          PY
          . "$NATIVE_ROOT/metadata/pins.env"
          git -C "$product" fetch --no-tags --depth=1 origin "$BASE_SHA"
          runtime="$NATIVE_ROOT/sources/runtime"
          git init --quiet "$runtime"
          git -C "$runtime" remote add origin https://github.com/michaelrolphone-cmyk/RiscRTE.git
          git -C "$runtime" fetch --no-tags --depth=1 origin "$RUNTIME_SHA"
          git -C "$runtime" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$runtime" rev-parse HEAD)" = "$RUNTIME_SHA"
          git -C "$runtime" submodule update --init --recursive --depth=1
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "$SDK_SHA"
      - name: Check profile preservation and build the selected native variant
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          export ESP_IDF_VERSION=6.1.0
          python -m pip install pyelftools==0.32
          compiler="$(command -v xtensa-esp-elf-gcc)"
          "$compiler" --version | tee "$NATIVE_ROOT/metadata/compiler-version.txt"
          grep -F 'esp-15.2.0_20251204' "$NATIVE_ROOT/metadata/compiler-version.txt"
          test "$("$compiler" -dumpfullversion)" = 15.2.0
          product="$NATIVE_ROOT/sources/product"
          python "$product/scripts/test_wifi_local_native.py" --runtime "$NATIVE_ROOT/sources/runtime"
          python "$product/scripts/build_wifi_local_native.py" \
            --runtime "$NATIVE_ROOT/sources/runtime" --sdk "$IDF_PATH" --compiler "$compiler" \
            --build "$NATIVE_ROOT/build" --output "$NATIVE_ROOT/evidence" --variant "$VARIANT" \
            2>&1 | tee "$NATIVE_ROOT/logs/native-build.log"
      - name: Preserve linked diagnostics even if a qualification check fails
        if: always()
        run: |
          set -euo pipefail
          test -f "$NATIVE_ROOT/build/riscrte_native.elf" || exit 0
          . "$IDF_PATH/export.sh"
          xtensa-esp-elf-readelf -SW "$NATIVE_ROOT/build/riscrte_native.elf" > "$NATIVE_ROOT/logs/linked-sections.txt"
          xtensa-esp-elf-nm -S --size-sort "$NATIVE_ROOT/build/riscrte_native.elf" | tail -100 > "$NATIVE_ROOT/logs/largest-symbols.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: watch-wifi-local-${{ matrix.variant }}-${{ env.SOURCE_SHA }}
          path: |
            ${{ env.NATIVE_ROOT }}/logs/
            ${{ env.NATIVE_ROOT }}/metadata/
            ${{ env.NATIVE_ROOT }}/evidence/
            ${{ env.NATIVE_ROOT }}/build/native-build-evidence/
            ${{ env.NATIVE_ROOT }}/build/qualification/
            ${{ env.NATIVE_ROOT }}/build/radio-iq-proof.json
            ${{ env.NATIVE_ROOT }}/build/log/
            ${{ env.NATIVE_ROOT }}/build/riscrte_native.elf
            ${{ env.NATIVE_ROOT }}/build/riscrte_native.bin
            ${{ env.NATIVE_ROOT }}/build/riscrte_native.map
            ${{ env.NATIVE_ROOT }}/build/compile_commands.json
            ${{ env.NATIVE_ROOT }}/build/partition_table/partition-table.bin
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
