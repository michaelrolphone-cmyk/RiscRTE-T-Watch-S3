name: T-Watch 1.1.37 qualified native SDR prerelease

on:
  push:
    branches: [release/twatch-1.1.37-sdr-native]
    paths:
      - '.github/workflows/shared-app-repair-release.yml'
      - 'docs/shared-app-repair/**'
      - 'native/shared-ui-profile/**'
      - 'scripts/*app_repair*.py'

permissions:
  contents: read
concurrency:
  group: twatch-shared-app-repair-1.1.37
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PRODUCT_REPOSITORY: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
  BASELINE_TAG: test-shared-app-repair-1.1.36
  RELEASE_TAG: test-native-sdr-1.1.37
  PYTHONDONTWRITEBYTECODE: '1'
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'No'
  ASAN_OPTIONS: detect_leaks=0

jobs:
  pins:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE-T-Watch-S3'
    runs-on: ubuntu-24.04
    outputs:
      finalized: ${{ steps.pins.outputs.finalized }}
      publication_enabled: ${{ steps.pins.outputs.publication_enabled }}
      runtime_revision: ${{ steps.pins.outputs.runtime_revision }}
      replay_source_revision: ${{ steps.pins.outputs.replay_source_revision }}
      apps_system_revision: ${{ steps.pins.outputs.apps_system_revision }}
      sdr_system_revision: ${{ steps.pins.outputs.sdr_system_revision }}
      sdr_utilities_revision: ${{ steps.pins.outputs.sdr_utilities_revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: pins
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          from watch_app_repair import PINS,require_final
          if PINS['finalized']:require_final()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for k in ('finalized','publication_enabled','runtime_revision','replay_source_revision','apps_system_revision','sdr_system_revision','sdr_utilities_revision'):
                  print(k+'='+str(PINS.get(k,'')).lower(),file=out)
          PY

  package:
    needs: pins
    if: needs.pins.outputs.finalized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      checksums_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ${{ needs.pins.outputs.runtime_revision }}
          path: .source/runtime
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ needs.pins.outputs.replay_source_revision }}
          path: .source/replay-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ needs.pins.outputs.sdr_system_revision }}
          path: .source/renderer-system
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ needs.pins.outputs.sdr_utilities_revision }}
          path: .source/renderer-utilities
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare source-owned native profile and run product contracts
        run: |
          set -euo pipefail
          python3 -m pip install platformio==6.1.19 esptool==4.11.0 pyelftools==0.32
          git -C .source/runtime fetch --no-tags --depth=1 origin "$(python3 -c 'import json; print(json.load(open("docs/shared-app-repair/source-pins.json"))["profile_origin_runtime"])')"
          python3 scripts/test_watch_app_repair.py
          python3 scripts/test_app_repair_package.py
          python3 scripts/test_shared_native_ui.py
          python3 scripts/test_shared_ui_package.py
          python3 scripts/watch_app_repair.py native-stage --runtime .source/runtime
          git diff --exit-code
      - name: Exercise shared Runtime capability, catalog and trace contracts
        working-directory: .source/runtime
        run: |
          set -euo pipefail
          bash test/run_app_capability_dispatch_tags_test.sh
          for sanitize in 0 1; do
            SANITIZE="$sanitize" bash test/run_performance_capacity_test.sh
            SANITIZE="$sanitize" bash test/run_app_catalog_runtime_test.sh
          done
      - name: Install the exact replay toolchain
        run: pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Download exact published baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .inputs/downloaded
          gh release download "$BASELINE_TAG" --repo "$PRODUCT_REPOSITORY" --pattern '*.bin' --dir .inputs/downloaded
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from watch_app_repair import PINS,sha
          matches=[p for p in Path('.inputs/downloaded').glob('*.bin') if p.stat().st_size==0x1000000 and sha(p.read_bytes())==PINS['baseline_sha256']]
          if len(matches)!=1:raise SystemExit('Exact released .36 baseline absent/ambiguous')
          Path('.inputs/baseline.bin').write_bytes(matches[0].read_bytes())
          PY
          gh release download "$BASELINE_TAG" --repo "$PRODUCT_REPOSITORY" --pattern 'TWatch-1.1.36-App-SDR-Repair-Evidence.zip' --dir .inputs/downloaded
          python3 scripts/stage_app_repair_native.py --baseline .inputs/baseline.bin \
            --evidence .inputs/downloaded/TWatch-1.1.36-App-SDR-Repair-Evidence.zip --runtime .source/runtime
      - name: Qualify exact source, admission, both-bank preservation and artifacts
        run: |
          set -euo pipefail
          python3 scripts/build_app_repair_release.py --baseline .inputs/baseline.bin \
            --runtime .source/runtime --replay-source .source/replay-source \
            --renderer-system .source/renderer-system --renderer-utilities .source/renderer-utilities \
            --compiler "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" \
            --source-revision "$GITHUB_SHA" --output dist/shared-app-repair
          (cd dist/shared-app-repair/assets && sha256sum --check --strict SHA256SUMS)
      - id: digest
        run: echo "sha256=$(sha256sum dist/shared-app-repair/assets/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twatch-shared-app-repair-${{ github.sha }}
          path: dist/shared-app-repair/assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: [pins,package]
    if: needs.pins.outputs.publication_enabled == 'true' && github.repository == 'michaelrolphone-cmyk/RiscRTE-T-Watch-S3' && github.ref == 'refs/heads/release/twatch-1.1.37-sdr-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: twatch-shared-app-repair-${{ github.sha }}
          path: release-assets
      - name: Verify immutable manifest and source binding
        env:
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums_sha256 }}
          RUNTIME_REVISION: ${{ needs.pins.outputs.runtime_revision }}
          REPLAY_SOURCE_REVISION: ${{ needs.pins.outputs.replay_source_revision }}
          APPS_SYSTEM_REVISION: ${{ needs.pins.outputs.apps_system_revision }}
        run: |
          set -euo pipefail
          cd release-assets
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('release.json').read_text())
          assert r['source_revision']==os.environ['GITHUB_SHA'] and r['runtime_revision']==os.environ['RUNTIME_REVISION'] and r['replay_source_revision']==os.environ['REPLAY_SOURCE_REVISION'] and r['apps_system_revision']==os.environ['APPS_SYSTEM_REVISION']
          names={line.split('  ',1)[1] for line in Path('SHA256SUMS').read_text().splitlines()}
          assert {p.name for p in Path('.').iterdir()}==names|{'SHA256SUMS'}
          PY
      - name: Publish a new prerelease without overwriting tags or assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then exit 1; fi
          gh api "repos/$PRODUCT_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tags.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert not any(r['ref']=='refs/tags/'+os.environ['RELEASE_TAG'] for r in json.loads((Path(os.environ['RUNNER_TEMP'])/'tags.json').read_text()))
          PY
          gh release create "$RELEASE_TAG" release-assets/* --repo "$PRODUCT_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title 'T-Watch 1.1.37 native SDR' \
            --notes-file release-assets/RELEASE-NOTES.txt
      - name: Verify published source and re-downloaded asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$PRODUCT_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          mkdir downloaded-release
          gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --dir downloaded-release
          cd downloaded-release
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
