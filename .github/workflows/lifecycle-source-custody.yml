name: Lifecycle source custody
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-source-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Verify original source history and selected code
        run: python scripts/check_lifecycle_source_snapshot.py
      - name: Reject unqualified compiler inputs and dependency records
        run: python -m unittest discover -s tests -p test_lifecycle_source_custody.py -v
