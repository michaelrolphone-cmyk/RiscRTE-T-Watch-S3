name: Check midpoint publication guards
on:
  pull_request:
    paths:
      - 'release/midpoint-test-acceptance.json'
      - 'release/midpoint-test-evidence/**'
      - 'scripts/publish_midpoint_test.py'
      - 'tests/test_midpoint_publication.py'
      - '.github/workflows/midpoint*publication*.yml'
      - 'docs/MIDPOINT_TEST_PUBLICATION.md'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -p test_midpoint_publication.py -v
