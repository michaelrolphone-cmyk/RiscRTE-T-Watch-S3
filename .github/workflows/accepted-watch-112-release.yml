name: Publish accepted complete Watch 1.0.12
on:
  pull_request:
    paths:
      - 'release/complete-1.0.12/**'
      - 'scripts/publish_accepted_watch_112.py'
      - 'scripts/reconstruct_watch_112_sources.py'
      - 'tests/test_accepted_watch_112_release.py'
      - 'tests/test_watch_112_sources.py'
      - 'tests/test_watch_112_installed_app_admission.py'
      - 'tests/watch112_release/**'
      - '.github/workflows/accepted-watch-112-release.yml'
  push:
    branches: [main, master]
    paths:
      - 'release/complete-1.0.12/**'
      - 'scripts/publish_accepted_watch_112.py'
      - 'scripts/reconstruct_watch_112_sources.py'
      - 'tests/test_accepted_watch_112_release.py'
      - 'tests/test_watch_112_sources.py'
      - 'tests/test_watch_112_installed_app_admission.py'
      - 'tests/watch112_release/**'
      - '.github/workflows/accepted-watch-112-release.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: twatch-accepted-112-verification-${{ github.ref }}
  queue: max
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing release validation dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Check exact accepted bytes, source custody and refusal paths
        run: |
          python -m unittest discover -s tests -p test_accepted_watch_112_release.py -v
          python -m unittest discover -s tests -p test_watch_112_sources.py -v
          python -m unittest discover -s tests -p test_watch_112_installed_app_admission.py -v
      - name: Stage the original accepted bytes without rebuilding
        run: python scripts/publish_accepted_watch_112.py stage
      - name: Read-only immutable releases and predecessor check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_accepted_watch_112.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: verified-accepted-watch-112-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/accepted-watch-1.0.12/staged/
          if-no-files-found: error
  reconstruct:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore original sources using public Git prerequisites and five bundles
        run: |
          python scripts/reconstruct_watch_112_sources.py hydrate \
            --source-custody release/complete-1.0.12/source-custody.zip \
            --build-inputs-gzip-parts \
              release/complete-1.0.12/reconstruction-inputs.zip.gz.part1 \
              release/complete-1.0.12/reconstruction-inputs.zip.gz.part2 \
            --output "$RUNNER_TEMP/watch112-reconstructed"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-${{ runner.arch }}-watch112-original-tools-v1
      - name: Install original pinned native and app build dependencies
        run: |
          python -m pip install -r "$RUNNER_TEMP/watch112-reconstructed/RiscRTE/requirements-ci.txt"
          python -m pip install -r scripts/requirements.txt
      - name: Compile original Runtime, all apps and assemble a separate initial image
        run: python scripts/reconstruct_watch_112_sources.py build --output "$RUNNER_TEMP/watch112-reconstructed"
      - uses: actions/upload-artifact@v4
        with:
          name: watch112-reconstruction-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/watch112-reconstructed/reconstruction-result.json
            ${{ runner.temp }}/watch112-reconstructed/RiscRTE-T-Watch-S3/dist/reconstructed-1.0.12-initial/
          if-no-files-found: error
  publish:
    needs: [verify, reconstruct]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: twatch-driver-publication
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing release validation dependencies
        run: python -m pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: verified-accepted-watch-112-${{ github.sha }}
          path: dist/accepted-watch-1.0.12/staged
      - name: Publish immutable accepted releases, then compare-and-swap the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_accepted_watch_112.py publish
