name: Timecard modal policy recipe
on:
  push:
    branches: [work/timecard-input-policy-20261012]
  pull_request:
    paths: ['**/*timecard*policy*', '**/timecard-input-policy/**', '.github/workflows/timecard-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/test_timecard_policy_recipe.py
