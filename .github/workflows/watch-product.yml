name: Publish accepted Watch product
on:
  pull_request:
    paths:
      - 'release/**'
      - 'scripts/publish_watch_product.py'
      - 'scripts/watch_release_index.py'
      - 'scripts/watch_main_product.py'
      - 'scripts/watch_product_trigger.py'
      - 'scripts/read_only_spiffs.py'
      - 'tests/test_watch*product.py'
      - '.github/workflows/watch-product.yml'
  workflow_run:
    workflows: ['Publish versioned drivers']
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# Shared with existing driver publication: component releases finish before index.
concurrency:
  group: twatch-driver-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      promote: ${{ steps.promotion.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Publication and index safety tests
        run: python -m unittest discover -s tests -p 'test_watch*product.py' -v
      - name: Skip automatic re-promotion of an unchanged published product
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_PRODUCT_EVENT: ${{ github.event_name }}
        run: python scripts/watch_product_trigger.py
      - name: Read reviewed frozen product source pins
        if: steps.promotion.outputs.proceed == 'true'
        id: product
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from publish_watch_product import read_config
          product = read_config()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key in ('watch', 'runtime'):
                  out.write(key + '=' + product['sources'][key]['accepted_sha'] + '\n')
          PY
      - uses: actions/checkout@v4
        if: steps.promotion.outputs.proceed == 'true'
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: ${{ steps.product.outputs.watch }}
          path: .dependencies/accepted-watch
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.promotion.outputs.proceed == 'true'
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ${{ steps.product.outputs.runtime }}
          path: .dependencies/accepted-runtime
          persist-credentials: false
      - name: Download and hash exact accepted CI inputs
        if: steps.promotion.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_watch_product.py download
      - name: Promote accepted bytes and validate every component
        if: steps.promotion.outputs.proceed == 'true'
        run: |
          python scripts/publish_watch_product.py stage --accepted-watch .dependencies/accepted-watch --runtime-source .dependencies/accepted-runtime
          python scripts/publish_watch_product.py verify
          WATCH_PRODUCT_STAGE="$PWD/dist/watch-product" python -m unittest discover -s tests -p 'test_watch*product.py' -v
      - uses: actions/upload-artifact@v4
        if: steps.promotion.outputs.proceed == 'true'
        with:
          name: verified-watch-product-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          path: dist/watch-product/
          if-no-files-found: error
  publish:
    needs: verify
    if: needs.verify.outputs.promote == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: verified-watch-product-${{ github.event.workflow_run.head_sha || github.sha }}
          path: dist/watch-product
      - name: Reverify, publish immutable releases, then publish branch index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_watch_product.py publish
