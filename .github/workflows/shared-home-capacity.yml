name: Shared Home native provider capacity
on:
  push:
    branches: [work/shared-home-provider-capacity-20261102]
  pull_request:
    paths:
      - .github/workflows/shared-home-capacity.yml
      - scripts/*shared_home_capacity*
      - docs/shared-home-capacity/**
      - profiles/shared-home-capacity.cmake
      - scripts/native_idf61_candidate.py

permissions:
  contents: read
concurrency:
  group: shared-home-capacity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      CCACHE_DISABLE: '1'
      IDF_CCACHE_ENABLE: '0'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Materialize exact owning source
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libssl-dev
          export NATIVE_ROOT="$RUNNER_TEMP/shared-home-capacity"
          echo "NATIVE_ROOT=$NATIVE_ROOT" >> "$GITHUB_ENV"
          test ! -e "$NATIVE_ROOT"
          mkdir -p "$NATIVE_ROOT/sources"
          git init --quiet "$NATIVE_ROOT/sources/product"
          git -C "$NATIVE_ROOT/sources/product" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$NATIVE_ROOT/sources/product" fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C "$NATIVE_ROOT/sources/product" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$NATIVE_ROOT/sources/product" rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Build and qualify preserved native firmware unit
        run: bash "$NATIVE_ROOT/sources/product/scripts/run_shared_home_capacity_ci.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-home-capacity-${{ env.SOURCE_SHA }}-${{ github.event_name }}
          path: |
            ${{ env.NATIVE_ROOT }}/candidate/
            ${{ env.NATIVE_ROOT }}/metadata/
            ${{ env.NATIVE_ROOT }}/logs/
            ${{ env.NATIVE_ROOT }}/home-a/build.json
            ${{ env.NATIVE_ROOT }}/home-b/build.json
            ${{ env.NATIVE_ROOT }}/build/native-build-evidence/
            ${{ env.NATIVE_ROOT }}/build/log/
            ${{ env.NATIVE_ROOT }}/build/riscrte_native.elf
            ${{ env.NATIVE_ROOT }}/build/riscrte_native.bin
            ${{ env.NATIVE_ROOT }}/build/riscrte_native.map
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
