          path: |
            dist/update-cross-layer/*.log
            dist/update-cross-layer/**/power-flash.bin.gz
          if-no-files-found: error
          retention-days: 14


  latest-main-image:
    needs: [software-checks, alarm-integration, points-integration, points-store-faces, wifi-integration, production-store-admission, update-integration, update-cross-layer]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read exact latest Runtime source
        id: runtime
        run: |
          python - <<'PY'
          import json, os
          value=json.load(open('apps/current-runtime-requirements.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('sha='+value['source_sha']+'\n')
              out.write('version='+value['firmware_version']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ${{ steps.runtime.outputs.sha }}
          path: .latest/runtime
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact integrated current-app source pins
        id: current
        run: |
          python - <<'PY_CURRENT'
          import json, os
          pins=json.load(open('apps/current-apps-sources.json'))['sources']
          runtime=json.load(open('apps/current-runtime-requirements.json'))['source_sha']
          if pins['runtime']['commit'] != runtime:
              raise ValueError('Final current-app Runtime differs from paired native source')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for name in ('system-apps','utilities','productivity'):
                  out.write(name.replace('-','_')+'='+pins[name]['commit']+'\n')
          PY_CURRENT
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.current.outputs.system_apps }}
          path: .latest/current-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.current.outputs.utilities }}
          path: .latest/current-utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Productivity
          ref: ${{ steps.current.outputs.productivity }}
          path: .latest/current-productivity
          persist-credentials: false
      - name: Install pinned build tools
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m pip install platformio==6.1.19
          python -m pip install -r .latest/runtime/requirements-ci.txt
          pio pkg install --global --tool 'platformio/tool-mkspiffs@2.230.0'
      - name: Rebuild exact latest paired Runtime
        working-directory: .latest/runtime
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
        run: |
          pio run -e esp32s3-16mb-paired -j 1
          BOOTLOADER_FILE=.pio/build/esp32s3-16mb-paired/bootloader.bin bash test/run_native_bank_test.sh
          python scripts/paired_candidate.py --source-sha "$RUNTIME_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: twatch-update-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: .latest/watch-artifact
      - uses: actions/download-artifact@v4
        with:
          name: twatch-points-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: .latest/points-artifact
      - name: Rebuild exact Watch driver packages for final image verification
        run: python scripts/build_twatch_drivers.py
      - name: Compile the exact integrated final Watch app cohort
        run: |
          export TWATCH_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          echo "TWATCH_CC=$TWATCH_CC" >> "$GITHUB_ENV"
          python scripts/build_current_apps.py \
            --system-apps .latest/current-system \
            --utilities .latest/current-utilities \
            --productivity .latest/current-productivity \
            --runtime .latest/runtime \
            --baseline .latest/watch-artifact/audio-common/audio-tools-common.zip \
            --output dist/current-apps
          python -m unittest discover -s tests -p test_current_apps_overlay.py -v
          python -m unittest discover -s tests -p test_current_clock_manifest.py -v
          python -m unittest discover -s tests -p test_compact_current_elf.py -v
          python scripts/test_quick_clock.py --system-apps .latest/current-system
          python .latest/current-system/scripts/test_quick_actions.py
          python scripts/test_alarm_integration.py --system-apps .latest/current-system --utilities .latest/current-utilities
          python scripts/test_points_integration.py --system-apps .latest/current-system --utilities .latest/current-utilities
          python scripts/test_points_cold_boot_idle.py --system-apps .latest/current-system --utilities .latest/current-utilities
      - name: Assemble installable latest-main Watch image
        env:
          TWATCH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/build_latest_main_flash.py \
            --artifact-dir .latest/watch-artifact \
            --points-artifact-dir .latest/points-artifact \
            --current-apps-artifact-dir dist/current-apps \
            --runtime-source .latest/runtime \
            --runtime-candidate .latest/runtime/dist/esp32s3-16mb-paired \
            --mkspiffs "$HOME/.platformio/packages/tool-mkspiffs/mkspiffs_espressif32_arduino" \
            --watch-head "$TWATCH_HEAD" \
            --output dist/latest-main
      - name: Execute the actual final current-app store through Runtime
        run: |
          SANITIZE=0 python scripts/test_current_apps_runtime.py \
            --runtime .latest/runtime \
            --system-apps .latest/current-system \
            --utilities .latest/current-utilities \
            --productivity .latest/current-productivity \
            --current-apps-artifact-dir dist/current-apps \
            --bin dist/latest-main/twatch-s3-main-*.bin \
            --output dist/current-runtime/plain
          SANITIZE=1 ADDRESS_SANITIZE=1 python scripts/test_current_apps_runtime.py \
            --runtime .latest/runtime \
            --system-apps .latest/current-system \
            --utilities .latest/current-utilities \
            --productivity .latest/current-productivity \
            --current-apps-artifact-dir dist/current-apps \
            --bin dist/latest-main/twatch-s3-main-*.bin \
            --output dist/current-runtime/sanitized
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-current-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/current-runtime/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-current-apps-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/current-apps/current-apps.zip
            dist/current-apps/current-apps-build.json
            dist/current-apps/source-profile.json
            dist/current-apps/files/
            dist/current-apps/licenses/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-flashable-bin-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/latest-main/
          if-no-files-found: error
          retention-days: 30
