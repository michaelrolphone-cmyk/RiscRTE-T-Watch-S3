  production-store-admission:
    needs: [points-integration, wifi-integration]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: af1845330ebb8828f76472b6137dcfedaca03846
          path: .admission-dependencies/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: e972f0ff951ca96ca0999ee728dbad3a92434c4f
          path: .admission-dependencies/baseline-runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: abef681d6c9c2b58729909a9961118ea20feee5e
          path: .admission-dependencies/native-loader-baseline
          persist-credentials: false
      - id: admission-points-pins
        name: Read exact Points execution source pins
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('apps/points-sources.json'))
          print('system_apps='+p['system-apps']['commit'])
          print('utilities='+p['utilities']['commit'])
          PY
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 83167b245149b1114a0497ab09bf2b410cd715ff
          path: .admission-dependencies/system-apps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 5418d9dc7f9963d96b5b8b11c40658ee753d9cbd
          path: .admission-dependencies/utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.admission-points-pins.outputs.system_apps }}
          path: .admission-dependencies/points-system-apps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.admission-points-pins.outputs.utilities }}
          path: .admission-dependencies/points-utilities
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: twatch-points-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: .admission-input/points
      - uses: actions/download-artifact@v4
        with:
          name: twatch-wifi-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: .admission-input/wifi
      - name: Pinned SPIFFS extraction tool
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'platformio/tool-mkspiffs@2.230.0'
          echo "TWATCH_MKSPIFFS=$HOME/.platformio/packages/tool-mkspiffs/mkspiffs_espressif32_arduino" >> "$GITHUB_ENV"
      - name: Old Runtime rejects untouched production stores
        run: |
          python scripts/check_runtime_store_admission.py --runtime .admission-dependencies/baseline-runtime --archive .admission-input/points/points-launcher-deployments/*.zip .admission-input/wifi/wifi-launcher-deployments/*.zip --image .admission-input/points/points-common/*-bootfs.bin .admission-input/wifi/wifi-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --expect-count 18 --expect-error 'app requirement not uniquely authorized' --output dist/production-admission/baseline.json
      - name: Repaired Runtime admits every exact production store
        run: |
          python scripts/check_runtime_store_admission.py --runtime .admission-dependencies/runtime --archive .admission-input/points/points-launcher-deployments/*.zip .admission-input/wifi/wifi-launcher-deployments/*.zip --image .admission-input/points/points-common/*-bootfs.bin .admission-input/wifi/wifi-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --expect-count 18 --output dist/production-admission/repaired.json
          python scripts/check_runtime_store_admission.py --runtime .admission-dependencies/runtime --image .admission-input/wifi/wifi-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --expect-count 1 --preserved-store apps/wifi-store-baseline.json --current-pmu-sleep-repair --output dist/production-admission/preserved.json
      - name: Actual default Clock and providers on unchanged production policies
        run: |
          # Points and Wi-Fi intentionally carry different reviewed alarm-service
          # generations now. Exercise each store with its own exact service/time
          # source pins instead of substituting one provider source for both.
          SANITIZE=0 python scripts/test_production_store_runtime.py --runtime .admission-dependencies/native-loader-baseline --registry-support .admission-dependencies/runtime/test/support/native_registry --system-apps .admission-dependencies/points-system-apps --utilities .admission-dependencies/points-utilities --image .admission-input/points/points-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --expect-runtime-error 'alarm-service: elf-open-failed rc=0 (0x0)' --output dist/production-admission/native-loader-baseline-points
          SANITIZE=0 python scripts/test_production_store_runtime.py --runtime .admission-dependencies/native-loader-baseline --registry-support .admission-dependencies/runtime/test/support/native_registry --system-apps .admission-dependencies/system-apps --utilities .admission-dependencies/utilities --image .admission-input/wifi/wifi-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --expect-runtime-error 'alarm-service: elf-open-failed rc=0 (0x0)' --output dist/production-admission/native-loader-baseline-wifi
          SANITIZE=0 python scripts/test_production_store_runtime.py --runtime .admission-dependencies/runtime --system-apps .admission-dependencies/points-system-apps --utilities .admission-dependencies/points-utilities --image .admission-input/points/points-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --output dist/production-admission/execution-points
          SANITIZE=0 python scripts/test_production_store_runtime.py --runtime .admission-dependencies/runtime --system-apps .admission-dependencies/system-apps --utilities .admission-dependencies/utilities --image .admission-input/wifi/wifi-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --output dist/production-admission/execution-wifi
          SANITIZE=1 ADDRESS_SANITIZE=1 python scripts/test_production_store_runtime.py --runtime .admission-dependencies/runtime --system-apps .admission-dependencies/points-system-apps --utilities .admission-dependencies/points-utilities --image .admission-input/points/points-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --output dist/production-admission/execution-san-points
          SANITIZE=1 ADDRESS_SANITIZE=1 python scripts/test_production_store_runtime.py --runtime .admission-dependencies/runtime --system-apps .admission-dependencies/system-apps --utilities .admission-dependencies/utilities --image .admission-input/wifi/wifi-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --output dist/production-admission/execution-san-wifi
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-production-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/production-admission/*.json
            dist/production-admission/execution-*/provenance.json
            dist/production-admission/execution-san-*/provenance.json
            dist/production-admission/native-loader-baseline-*/provenance.json
          if-no-files-found: error

  update-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Read exact update source pins
        id: pins
        run: |
          python - <<'PY'
          import json,os
          pins=json.load(open('apps/update-sources.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            for name,value in pins.items():out.write(name+'='+value['commit']+'\n')
