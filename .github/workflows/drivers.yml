            dist/update-common/*.json
            dist/update-validation/**/admission-provenance.json
            dist/update-validation/**/execution-provenance.json
            dist/update-validation/**/abi-provenance.json
            dist/audio-tools/*.elf
            dist/audio-tools/*.json
            dist/audio-common/*.zip
            dist/audio-common/*.bin
            dist/audio-common/*.json
          if-no-files-found: error
          retention-days: 14

  update-cross-layer:
