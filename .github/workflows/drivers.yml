            out.write('system_apps='+pins['system-apps']['commit']+'\n')
            out.write('utilities='+pins['utilities']['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.audio_pins.outputs.system_apps }}
          path: .audio-dependencies/system-apps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.audio_pins.outputs.utilities }}
          path: .audio-dependencies/utilities
          persist-credentials: false
      - name: Pinned target compiler and SPIFFS tool
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          pio pkg install --global --tool 'platformio/tool-mkspiffs@2.230.0'
          echo "TWATCH_CC=$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" >> "$GITHUB_ENV"
          echo "TWATCH_MKSPIFFS=$HOME/.platformio/packages/tool-mkspiffs/mkspiffs_espressif32_arduino" >> "$GITHUB_ENV"
      - name: Original drivers and exact selected updater apps/providers
        env:
          UPDATE_MODE: ${{ steps.pins.outputs.mode }}
        run: |
          python scripts/build_twatch_drivers.py
          python scripts/board_baseline.py
          python scripts/check_twatch_drivers.py
          python scripts/build_update_apps.py --system-apps .update-dependencies/system-apps --utilities .update-dependencies/utilities --runtime .update-dependencies/runtime --productivity .update-dependencies/productivity --mode "$UPDATE_MODE"
          python scripts/build_update_deployment.py --mode "$UPDATE_MODE"
          python scripts/verify_update_deployment.py dist/update-launcher-deployments/*.zip
          python -m unittest discover -s tests -p 'test_update_*.py' -v
          python tests/update_store_inputs_test.py
      - name: Eight original archives, common store and SPIFFS custody
        env:
          WATCH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/build_update_common.py dist/update-launcher-deployments/*.zip --pr-head-sha "$WATCH_HEAD"
          for bundle in dist/update-common/*.zip; do
            python scripts/build_update_store.py "$bundle" --mkspiffs "$TWATCH_MKSPIFFS"
          done
      - name: Actual production-store admission and real default Clock health
        run: |
          python scripts/update_test_production_store_runtime.py --runtime .update-dependencies/runtime --system-apps .update-dependencies/system-apps --utilities .update-dependencies/utilities --productivity .update-dependencies/productivity --archive dist/update-launcher-deployments/*.zip dist/update-common/*.zip --image dist/update-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --output dist/update-validation/normal
          ADDRESS_SANITIZE=1 SANITIZE=1 ASAN_OPTIONS=detect_leaks=0 python scripts/update_test_production_store_runtime.py --runtime .update-dependencies/runtime --system-apps .update-dependencies/system-apps --utilities .update-dependencies/utilities --productivity .update-dependencies/productivity --archive dist/update-launcher-deployments/*.zip dist/update-common/*.zip --image dist/update-common/*-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --output dist/update-validation/sanitized
      - name: Frequency Generator and Audio Spectrum/Spectrogram integration
        env:
          WATCH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python .audio-dependencies/utilities/scripts/test_frequency_generator.py --system-apps .audio-dependencies/system-apps
          python .audio-dependencies/utilities/scripts/test_audio_spectrum.py --system-apps .audio-dependencies/system-apps
          python .audio-dependencies/utilities/scripts/test_spectrum_renderer.py --system-apps .audio-dependencies/system-apps
          python .audio-dependencies/utilities/scripts/test_audio_service_lifecycle.py --system-apps .audio-dependencies/system-apps --runtime .update-dependencies/runtime
          python scripts/build_audio_apps.py --system-apps .audio-dependencies/system-apps --utilities .audio-dependencies/utilities --baseline dist/update-common/*-update-launcher-common.zip
          python scripts/audio_overlay.py dist/update-common/*-update-launcher-common.zip --compiled dist/audio-tools --head "$WATCH_HEAD" --output dist/audio-common/audio-tools-common.zip
          python -m unittest discover -s tests -p test_audio_deployment.py -v
          python scripts/build_audio_store.py dist/audio-common/audio-tools-common.zip --mkspiffs "$TWATCH_MKSPIFFS" --output dist/audio-common
          python scripts/check_runtime_store_admission.py --runtime .update-dependencies/runtime --archive dist/audio-common/audio-tools-common.zip --image dist/audio-common/audio-tools-common-bootfs.bin --mkspiffs "$TWATCH_MKSPIFFS" --expect-count 2 --output dist/audio-common/admission-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-update-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/update-launcher/*.elf
            dist/update-launcher/*.json
            dist/update-launcher-deployments/*.zip
            dist/update-launcher-deployments/catalog.json
            dist/update-common/*.zip
