name: T-Watch driver contracts
on:
  push:
    branches: [main, master, feat/watch-alarm-lifecycle, feat/watch-points-in-time, feat/watch-wifi-settings, fix/watch-runtime-admission, fix/watch-provider-startup]
  pull_request:
permissions:
  contents: read
jobs:
  software-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python validation tools
        run: python -m pip install -r scripts/requirements.txt
      - name: Pinned ESP32-S3 compiler
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 180 https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32s3-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz -o "$RUNNER_TEMP/toolchain.tar.gz"
          echo "8aa17a6adf01efa5b1628c8ac578063a44d26ae9581d39486b92223a41ef262f  $RUNNER_TEMP/toolchain.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/toolchain"
          tar -xzf "$RUNNER_TEMP/toolchain.tar.gz" -C "$RUNNER_TEMP/toolchain"
          echo "TWATCH_CC=$RUNNER_TEMP/toolchain/xtensa-esp32s3-elf/bin/xtensa-esp32s3-elf-gcc" >> "$GITHUB_ENV"
      - name: Release automation tests
        run: python -m unittest discover -s tests -p 'test_*releases.py' -v
      - name: Host contract fixtures with UBSan
        run: |
          python scripts/test_contracts.py
          python scripts/test_alarm_outputs.py
          python scripts/test_panel_throughput.py
          python -m unittest discover -s tests -p test_clock_performance.py -v
      - name: Target ABI, ELF imports and packages
        run: python scripts/build_twatch_drivers.py
      - name: Versioned board baseline
        run: python scripts/board_baseline.py
      - name: Physical manifests, negative mappings and package hashes
        run: |
          python scripts/check_twatch_drivers.py
          python -m unittest discover -s tests -p test_pmu_sleep_custody.py -v
      - name: Clock app behavior with UBSan
        run: |
          python scripts/test_clock.py
          python scripts/test_deep_sleep.py
          python scripts/test_pmu_cold_boot_sleep.py
          python scripts/test_hybrid_sleep.py
          python scripts/test_crown.py
          python scripts/test_launcher_clock.py
          python scripts/test_watch_faces.py
          python scripts/test_watch_faces_collection_two.py
          python scripts/test_calendar_watch_faces.py
          python apps/clock/nova/tests/run.py
      - name: Actual Xtensa default application
        run: python scripts/build_clock_app.py
      - name: Explicit clock deployments and checksums
        run: |
          python scripts/build_clock_deployment.py --profile all
          python scripts/verify_clock_deployment.py dist/clock-deployments/*.zip
          python -m unittest discover -s tests -p test_clock_deployment.py -v
          python scripts/clock_frame_fixtures.py
      - name: Pinned SPIFFS tool and verified store images
        env:
          PLATFORMIO_CORE_DIR: ${{ runner.temp }}/pio-clock
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'platformio/tool-mkspiffs@2.230.0'
          for bundle in dist/clock-deployments/*.zip; do
            python scripts/build_clock_store.py "$bundle" --mkspiffs "$PLATFORMIO_CORE_DIR/packages/tool-mkspiffs/mkspiffs_espressif32_arduino"
          done
      - name: Common crown clock deployment and verified SPIFFS image
        env:
          PLATFORMIO_CORE_DIR: ${{ runner.temp }}/pio-clock
          TWATCH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest discover -s tests -p test_clock_common.py -v
          python scripts/build_clock_common.py --pr-head-sha "$TWATCH_PR_HEAD_SHA"
          python scripts/verify_clock_deployment.py dist/clock-common/*.zip
          for bundle in dist/clock-common/*.zip; do
            python scripts/build_clock_store.py "$bundle" --mkspiffs "$PLATFORMIO_CORE_DIR/packages/tool-mkspiffs/mkspiffs_espressif32_arduino" --output dist/clock-common
          done
      - name: Pinned shared System Apps source
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: b28428505c9e067bb6ea8a84d12f13ec0bcc4992
          path: .dependencies/system-apps
          persist-credentials: false
      - name: Pinned shared Battery source
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 9d08cb3224a86bb6a5c27bad11b3c70516c6f614
          path: .dependencies/utilities
          persist-credentials: false
      - name: Exact paired runtime source
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 8609fb92ee56ad1c6fb0417051c3fc9796c0edca
          path: .dependencies/runtime
          persist-credentials: false
      - name: Shared apps and launcher deployments
        run: |
          python .dependencies/system-apps/scripts/test_portable_apps.py --utilities .dependencies/utilities
          python scripts/test_portable_navigation.py --system-apps .dependencies/system-apps
          python scripts/build_launcher_apps.py --system-apps .dependencies/system-apps --utilities .dependencies/utilities
          python scripts/build_clock_deployment.py --profile all --launcher
          python scripts/verify_clock_deployment.py dist/launcher-deployments/*.zip
          python -m unittest discover -s tests -p test_launcher_deployment.py -v
          bash scripts/test_launcher_runtime.sh .dependencies/runtime .dependencies/system-apps .dependencies/utilities
      - name: Common launcher and verified SPIFFS images
        env:
          PLATFORMIO_CORE_DIR: ${{ runner.temp }}/pio-clock
          TWATCH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest discover -s tests -p test_launcher_common.py -v
          python scripts/build_launcher_common.py --pr-head-sha "$TWATCH_PR_HEAD_SHA"
          python scripts/verify_clock_deployment.py dist/launcher-common/*.zip
          for bundle in dist/launcher-deployments/*.zip; do
            python scripts/build_clock_store.py "$bundle" --output dist/launcher-images --mkspiffs "$PLATFORMIO_CORE_DIR/packages/tool-mkspiffs/mkspiffs_espressif32_arduino"
          done
          for bundle in dist/launcher-common/*.zip; do
            python scripts/build_clock_store.py "$bundle" --output dist/launcher-common --mkspiffs "$PLATFORMIO_CORE_DIR/packages/tool-mkspiffs/mkspiffs_espressif32_arduino"
          done
      # Picker-only custody is maintained by its own PR.
      # This increment adds explicit output drivers and alarm grants, verified
      # by the independent alarm closure/negative tests in the alarm job below.
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-launcher-deployments
          path: |
            dist/launcher/*.elf
            dist/launcher/*.json
            dist/launcher-deployments/*.zip
            dist/launcher-deployments/catalog.json
            dist/launcher-images/*.bin
            dist/launcher-images/*.json
            dist/launcher-common/*.zip
            dist/launcher-common/*.bin
            dist/launcher-common/*.json
            dist/twatch-rtc/metadata-proof.json
            dist/twatch-rtc/compiled-driver.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-clock-deployments
          path: |
            dist/clock/default.elf
            dist/clock/default.json
            dist/clock/build-record.json
            dist/clock-deployments/*.zip
            dist/clock-deployments/catalog.json
            dist/clock-frames/*.png
            dist/watch-faces/*.png
            dist/clock-frames/*.rgb565
            dist/clock-frames/expected.json
            dist/clock-images/*.bin
            dist/clock-images/*.json
            dist/clock-common/*.zip
            dist/clock-common/*.bin
            dist/clock-common/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twatch-driver-packages
          path: |
            dist/*.rte.zip
            dist/board-*.zip
            dist/board-catalog.json
            dist/catalog.json
            dist/twatch-rtc/driver.elf
            dist/twatch-rtc/metadata-proof.json
            dist/twatch-rtc/compiled-driver.elf
          if-no-files-found: error

  alarm-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 71dd405da28f938175d23bc042af18c1bfeff50e
          path: .alarm-dependencies/system-apps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 462a882ce1229da57813ecc290bbbef604f86530
          path: .alarm-dependencies/utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 8688f92069b99547f0d25ecbd12cfcad3bb52c53
          path: .alarm-dependencies/runtime
          persist-credentials: false
      - name: Production safe-point, retained app state and owned sleep tests
        run: |
          python scripts/test_alarm_integration.py --system-apps .alarm-dependencies/system-apps --utilities .alarm-dependencies/utilities
          python tests/alarm_cross_layer/run.py --watch . --runtime .alarm-dependencies/runtime --utilities .alarm-dependencies/utilities --system-apps .alarm-dependencies/system-apps
          SANITIZE=1 python tests/alarm_cross_layer/run.py --watch . --runtime .alarm-dependencies/runtime --utilities .alarm-dependencies/utilities --system-apps .alarm-dependencies/system-apps
          python .alarm-dependencies/system-apps/scripts/test_portable_alarm.py
          python .alarm-dependencies/system-apps/scripts/test_portable_alarm_settings.py
          python .alarm-dependencies/utilities/scripts/test_alarm_apps.py --system-apps .alarm-dependencies/system-apps --runtime .alarm-dependencies/runtime
          bash .alarm-dependencies/utilities/scripts/test_alarm_runtime.sh .alarm-dependencies/runtime .alarm-dependencies/system-apps
          SANITIZE=1 bash .alarm-dependencies/utilities/scripts/test_alarm_runtime.sh .alarm-dependencies/runtime .alarm-dependencies/system-apps
      - name: Pinned GCC8.4 and original native driver packages
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          pio pkg install --global --tool 'platformio/tool-mkspiffs@2.230.0'
          echo "TWATCH_CC=$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" >> "$GITHUB_ENV"
          echo "TWATCH_MKSPIFFS=$HOME/.platformio/packages/tool-mkspiffs/mkspiffs_espressif32_arduino" >> "$GITHUB_ENV"
      - name: Nine native apps, unchanged original service and exact deployment authority
        run: |
          python scripts/build_twatch_drivers.py
          python scripts/board_baseline.py
          python scripts/check_twatch_drivers.py
          python scripts/build_alarm_apps.py --system-apps .alarm-dependencies/system-apps --utilities .alarm-dependencies/utilities --runtime .alarm-dependencies/runtime
          bash scripts/test_alarm_target_loader.sh .alarm-dependencies/runtime .alarm-dependencies/utilities
          python scripts/build_clock_deployment.py --profile all --launcher --alarms
          python scripts/verify_alarm_deployment.py dist/alarm-launcher-deployments/*.zip
          python -m unittest discover -s tests -p test_alarm_deployment.py -v
      - name: Common alarm store, semantic custody and exact SPIFFS round trip
        env:
          TWATCH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest discover -s tests -p test_alarm_bundle.py -v
          python scripts/build_alarm_common.py dist/alarm-launcher-deployments/*.zip --pr-head-sha "$TWATCH_PR_HEAD_SHA"
          for bundle in dist/alarm-common/*.zip; do
            python scripts/build_alarm_store.py "$bundle" --mkspiffs "$TWATCH_MKSPIFFS"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-alarm-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/alarm-launcher/*.elf
            dist/alarm-launcher/*.json
            dist/alarm-launcher-deployments/*.zip
            dist/alarm-launcher-deployments/catalog.json
            dist/alarm-common/*.zip
            dist/alarm-common/*.bin
            dist/alarm-common/*.json
          if-no-files-found: error

  points-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - id: points-pins
        name: Read exact Points source pins
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('apps/points-sources.json'))
          for key in ('system-apps','utilities','runtime','productivity'):
              print(key.replace('-','_')+'='+p[key]['commit'])
          PY
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.points-pins.outputs.system_apps }}
          path: .points-dependencies/system-apps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.points-pins.outputs.utilities }}
          path: .points-dependencies/utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Productivity
          ref: ${{ steps.points-pins.outputs.productivity }}
          path: .points-dependencies/productivity
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ${{ steps.points-pins.outputs.runtime }}
          path: .points-dependencies/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 5418d9dc7f9963d96b5b8b11c40658ee753d9cbd
          path: .points-dependencies/legacy-utilities
          persist-credentials: false
      - name: Points projections, nine faces and foreground lifecycle
        run: |
          python scripts/test_points_watch_faces.py
          python scripts/test_points_label_pixels.py --system-apps .points-dependencies/system-apps --utilities .points-dependencies/utilities
          python scripts/test_points_stored_clock.py --system-apps .points-dependencies/system-apps --utilities .points-dependencies/utilities --productivity .points-dependencies/productivity --legacy-utilities .points-dependencies/legacy-utilities
          python scripts/test_points_integration.py --system-apps .points-dependencies/system-apps --utilities .points-dependencies/utilities
          python scripts/test_points_cold_boot_idle.py --system-apps .points-dependencies/system-apps --utilities .points-dependencies/utilities
          python .points-dependencies/utilities/scripts/test_points_apps.py --system-apps .points-dependencies/system-apps --runtime .points-dependencies/runtime
          python .points-dependencies/productivity/scripts/test_points_in_time.py --system-apps .points-dependencies/system-apps --utilities .points-dependencies/utilities
          python .points-dependencies/productivity/scripts/test_points_gui.py --system-apps .points-dependencies/system-apps --utilities .points-dependencies/utilities
          python .points-dependencies/productivity/scripts/test_points_picker.py --system-apps .points-dependencies/system-apps --utilities .points-dependencies/utilities
          python .points-dependencies/productivity/scripts/test_points_touch.py --system-apps .points-dependencies/system-apps --utilities .points-dependencies/utilities
          python tests/alarm_cross_layer/run.py --points --watch . --runtime .points-dependencies/runtime --utilities .points-dependencies/utilities --system-apps .points-dependencies/system-apps
          SANITIZE=1 python tests/alarm_cross_layer/run.py --points --watch . --runtime .points-dependencies/runtime --utilities .points-dependencies/utilities --system-apps .points-dependencies/system-apps
      - name: Pinned target tools
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          pio pkg install --global --tool 'platformio/tool-mkspiffs@2.230.0'
          echo "TWATCH_CC=$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" >> "$GITHUB_ENV"
          echo "TWATCH_MKSPIFFS=$HOME/.platformio/packages/tool-mkspiffs/mkspiffs_espressif32_arduino" >> "$GITHUB_ENV"
      - name: Ten native apps, service, seven keys and all profile closures
        run: |
          python scripts/build_twatch_drivers.py
          python scripts/board_baseline.py
          python scripts/check_twatch_drivers.py
          python scripts/build_points_apps.py --system-apps .points-dependencies/system-apps --utilities .points-dependencies/utilities --runtime .points-dependencies/runtime --productivity .points-dependencies/productivity
          bash scripts/test_alarm_target_loader.sh .points-dependencies/runtime .points-dependencies/utilities points-launcher
          python scripts/build_clock_deployment.py --profile all --launcher --alarms --points
          python scripts/verify_points_deployment.py dist/points-launcher-deployments/*.zip
          python -m unittest discover -s tests -p test_points_deployment.py -v
      - name: Exact common store, semantic custody and SPIFFS round trip
        env:
          TWATCH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest discover -s tests -p test_points_bundle.py -v
          python scripts/build_points_common.py dist/points-launcher-deployments/*.zip --pr-head-sha "$TWATCH_PR_HEAD_SHA"
          for bundle in dist/points-common/*.zip; do
            python scripts/build_points_store.py "$bundle" --mkspiffs "$TWATCH_MKSPIFFS"
          done
      - name: Current-schema paired Clock payload
        run: |
          python scripts/build_points_paired_clock.py --system-apps .points-dependencies/system-apps --utilities .points-dependencies/utilities
          python -m unittest discover -s tests -p test_points_paired_clock.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-points-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/points-launcher/*.elf
            dist/points-launcher/*.json
            dist/points-launcher-deployments/*.zip
            dist/points-launcher-deployments/catalog.json
            dist/points-common/*.zip
            dist/points-common/*.bin
            dist/points-common/*.json
            dist/points-native/*.png
            dist/points-label-pixels/*.png
            dist/points-label-pixels/*.json
            dist/points-label-pixels/*.tsv
            dist/points-paired-clock/*
          if-no-files-found: error

  points-store-faces:
    needs: points-integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read final image and Points source pins
        id: pins
        run: |
          python - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('apps/points-sources.json'))
          for name in ('system-apps','utilities','productivity'):
              print(name.replace('-','_')+'='+p[name]['commit'])
          print('runtime='+json.load(open('apps/update-runtime-requirements.json'))['source_sha'])
          PYCODE
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ${{ steps.pins.outputs.runtime }}
          path: .face-store/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pins.outputs.system_apps }}
          path: .face-store/system-apps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.pins.outputs.utilities }}
          path: .face-store/utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 5418d9dc7f9963d96b5b8b11c40658ee753d9cbd
          path: .face-store/legacy-utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: f89fed5816e2ae8ebad4e8332de0d0309c1b8281
          path: .face-store/metadata-legacy-utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Productivity
          ref: ${{ steps.pins.outputs.productivity }}
          path: .face-store/productivity
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: twatch-points-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: .face-store/artifact
      - name: Real Runtime app save, bound service and all persisted Clock IDs
        run: |
          ARCHIVE=$(find .face-store/artifact -name '*-points-launcher-common.zip')
          test -f "$ARCHIVE"
          python scripts/test_points_store_faces.py --runtime .face-store/runtime --system-apps .face-store/system-apps --utilities .face-store/utilities --legacy-utilities .face-store/legacy-utilities --metadata-legacy-utilities .face-store/metadata-legacy-utilities --productivity .face-store/productivity --archive "$ARCHIVE" --output dist/points-store-faces/normal
          SANITIZE=1 ASAN_OPTIONS=detect_leaks=0 python scripts/test_points_store_faces.py --runtime .face-store/runtime --system-apps .face-store/system-apps --utilities .face-store/utilities --legacy-utilities .face-store/legacy-utilities --metadata-legacy-utilities .face-store/metadata-legacy-utilities --productivity .face-store/productivity --archive "$ARCHIVE" --output dist/points-store-faces/sanitized
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-points-store-faces-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/points-store-faces/**/points-results.json
            dist/points-store-faces/**/provenance.json
            dist/points-store-faces/**/points-provenance.json
          if-no-files-found: error
          retention-days: 14

  wifi-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 83167b245149b1114a0497ab09bf2b410cd715ff
          path: .wifi-dependencies/system-apps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 5418d9dc7f9963d96b5b8b11c40658ee753d9cbd
          path: .wifi-dependencies/utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Productivity
          ref: 43c23fee899cd2af8b6b5339b80e778018fb6295
          path: .wifi-dependencies/productivity
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: af1845330ebb8828f76472b6137dcfedaca03846
          path: .wifi-dependencies/runtime
          persist-credentials: false
      - name: Production Wi-Fi, saved-profile reuse and radio sleep lifecycle
        run: |
          python scripts/test_wifi_driver.py
          python .wifi-dependencies/system-apps/scripts/test_portable_wifi.py
          python tests/wifi_cross_layer/run.py --runtime .wifi-dependencies/runtime --system-apps .wifi-dependencies/system-apps --utilities .wifi-dependencies/utilities
          SANITIZE=1 python tests/wifi_cross_layer/run.py --runtime .wifi-dependencies/runtime --system-apps .wifi-dependencies/system-apps --utilities .wifi-dependencies/utilities
          python scripts/test_points_integration.py --system-apps .wifi-dependencies/system-apps --utilities .wifi-dependencies/utilities
          python tests/alarm_cross_layer/run.py --points --watch . --runtime .wifi-dependencies/runtime --utilities .wifi-dependencies/utilities --system-apps .wifi-dependencies/system-apps
          SANITIZE=1 python tests/alarm_cross_layer/run.py --points --watch . --runtime .wifi-dependencies/runtime --utilities .wifi-dependencies/utilities --system-apps .wifi-dependencies/system-apps
      - name: Pinned target tools
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          pio pkg install --global --tool 'platformio/tool-mkspiffs@2.230.0'
          echo "TWATCH_CC=$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" >> "$GITHUB_ENV"
          echo "TWATCH_MKSPIFFS=$HOME/.platformio/packages/tool-mkspiffs/mkspiffs_espressif32_arduino" >> "$GITHUB_ENV"
      - name: Eleven native apps, radio isolation and all profile closures
        run: |
          python scripts/build_twatch_drivers.py
          python scripts/board_baseline.py
          python scripts/check_twatch_drivers.py
          python scripts/build_wifi_apps.py --system-apps .wifi-dependencies/system-apps --utilities .wifi-dependencies/utilities --runtime .wifi-dependencies/runtime --productivity .wifi-dependencies/productivity
          bash scripts/test_alarm_target_loader.sh .wifi-dependencies/runtime .wifi-dependencies/utilities wifi-launcher
          python scripts/build_clock_deployment.py --profile all --launcher --alarms --points --wifi
          python scripts/verify_wifi_deployment.py dist/wifi-launcher-deployments/*.zip
          python -m unittest discover -s tests -p test_wifi_deployment.py -v
      - name: Exact common store, semantic custody and SPIFFS round trip
        env:
          TWATCH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest discover -s tests -p test_wifi_bundle.py -v
          python scripts/build_wifi_common.py dist/wifi-launcher-deployments/*.zip --pr-head-sha "$TWATCH_PR_HEAD_SHA"
          for bundle in dist/wifi-common/*.zip; do
            python scripts/build_wifi_store.py "$bundle" --mkspiffs "$TWATCH_MKSPIFFS"
          done
          python -m unittest discover -s tests -p test_read_only_spiffs.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: twatch-wifi-integration-${{ github.event.pull_request.head.sha || github.sha }}
