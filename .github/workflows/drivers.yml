        run: |
          mkdir -p dist/update-cross-layer
          python tests/update_cross_layer/decode_bootloader.py dist/update-cross-layer/bootloader-corpus.bin
          BUILD_DIR="$PWD/dist/update-cross-layer/normal" JOBS=2 bash tests/update_cross_layer/run.sh .update-dependencies/runtime .update-dependencies/system-apps "$PWD/dist/update-cross-layer/bootloader-corpus.bin" | tee dist/update-cross-layer/normal.log
          SANITIZE=1 BUILD_DIR="$PWD/dist/update-cross-layer/sanitized" JOBS=2 bash tests/update_cross_layer/run.sh .update-dependencies/runtime .update-dependencies/system-apps "$PWD/dist/update-cross-layer/bootloader-corpus.bin" | tee dist/update-cross-layer/sanitized.log
