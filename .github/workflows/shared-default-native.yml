name: Shared default native firmware
on:
  push:
    branches: [work/shared-default-package, release/shared-default-1.1.42]
    paths:
      - .github/workflows/shared-default-native.yml
      - scripts/build_shared_default_native.py
      - scripts/shared_default_qualification.py
      - scripts/package_shared_default.py
      - scripts/shared_default_release.py
      - scripts/publish_shared_default_release.py
      - scripts/test_shared_default_release.py
      - scripts/test_shared_default_package.py
      - scripts/run_shared_default_native_ci.sh
      - docs/shared-default/**
      - profiles/native-idf61.cmake
permissions:
  contents: read
concurrency:
  group: shared-default-native-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE-T-Watch-S3'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    outputs:
      publication_enabled: ${{ steps.build.outputs.publication_enabled }}
      release_tag: ${{ steps.build.outputs.release_tag }}
      release_branch: ${{ steps.build.outputs.release_branch }}
      version: ${{ steps.build.outputs.version }}
      checksums_sha256: ${{ steps.build.outputs.checksums_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      CCACHE_DISABLE: '1'
      IDF_CCACHE_ENABLE: '0'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone exact product source as shell owner
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libssl-dev
          export NATIVE_ROOT="$RUNNER_TEMP/shared-default-native"
          echo "NATIVE_ROOT=$NATIVE_ROOT" >> "$GITHUB_ENV"
          test ! -e "$NATIVE_ROOT"
          mkdir -p "$NATIVE_ROOT/sources"
          git init --quiet "$NATIVE_ROOT/sources/product"
          git -C "$NATIVE_ROOT/sources/product" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$NATIVE_ROOT/sources/product" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$NATIVE_ROOT/sources/product" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$NATIVE_ROOT/sources/product" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build twice-identical default and fresh native product; qualify final factory
        id: build
        run: bash "$NATIVE_ROOT/sources/product/scripts/run_shared_default_native_ci.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: shared-default-release-${{ github.sha }}
          path: ${{ env.NATIVE_ROOT }}/release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-default-native-evidence-${{ github.sha }}
          path: |
            ${{ env.NATIVE_ROOT }}/logs/
            ${{ env.NATIVE_ROOT }}/metadata/
            ${{ env.NATIVE_ROOT }}/candidate/
            ${{ env.NATIVE_ROOT }}/build/native-build-evidence/
            ${{ env.NATIVE_ROOT }}/build/log/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
  publish:
    needs: native
    if: needs.native.outputs.publication_enabled == 'true' && github.repository == 'michaelrolphone-cmyk/RiscRTE-T-Watch-S3' && github.ref == format('refs/heads/{0}', needs.native.outputs.release_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: product
    env:
      RELEASE_TAG: ${{ needs.native.outputs.release_tag }}
      VERSION: ${{ needs.native.outputs.version }}
      EXPECTED_SHA: ${{ needs.native.outputs.checksums_sha256 }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shared-default-release-${{ github.sha }}
          path: release-assets
      - name: Verify source-bound complete release bytes
        run: python3 scripts/shared_default_release.py --verify ../release-assets --expected-sha "$EXPECTED_SHA" --source-revision "$GITHUB_SHA"
      - name: Publish or resume exact-source draft; verify every asset before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_shared_default_release.py --assets ../release-assets --expected-sha "$EXPECTED_SHA" --source-revision "$GITHUB_SHA"
